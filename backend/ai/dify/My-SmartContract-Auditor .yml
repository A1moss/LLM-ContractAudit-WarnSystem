    - data:
        code: "import json\nfrom typing import Any\n\ndef parse_json(text):\n    if\
          \ not text: return {}\n    try: return json.loads(text) if isinstance(text,\
          \ str) else text\n    except:\n        import re\n        m = re.search(r'\\\
          {[\\s\\S]*\\}', str(text))\n        return json.loads(m.group(0)) if m else\
          \ {}\n\ndef main(rule_risks_json: str, rule_stats_json: str, rule_score:\
          \ float, rag_text: str) -> dict[str, Any]:\n    # 解析规则引擎结果\n    rule_risks\
          \ = json.loads(rule_risks_json) if rule_risks_json else []\n    for r in\
          \ rule_risks: r[\"source\"] = \"rule_engine\"\n    all_risks = list(rule_risks)\n\
          \    overall_score = float(rule_score)\n    # 解析RAG复核结果\n    rag = parse_json(rag_text)\n\
          \    confirmed = rag.get(\"confirmed_risks\", [])\n    for r in confirmed:\
          \ r[\"source\"] = \"rag_llm\"\n    supplement = rag.get(\"supplement_risks\"\
          , [])\n    for r in supplement: r[\"source\"] = \"rag_llm\"\n    all_risks.extend(confirmed)\n\
          \    all_risks.extend(supplement)\n    if rag.get(\"overall_risk_score\"\
          ):\n        overall_score = max(overall_score, float(rag[\"overall_risk_score\"\
          ]))\n    # 去重（规则+RAG交叉去重）\n    deduped = []\n    for risk in all_risks:\n\
          \        dup = False\n        for i, seen in enumerate(deduped):\n     \
          \       if risk.get(\"risk_id\") == seen.get(\"risk_id\"):\n           \
          \     t1 = risk.get(\"clause_text\",\"\")[:100]\n                t2 = seen.get(\"\
          clause_text\",\"\")[:100]\n                if t1 and t2:\n             \
          \       sim = len(set(t1)&set(t2))/max(len(set(t1)|set(t2)),1)\n       \
          \             if sim > 0.7:\n                        # 保留置信度更高的\n      \
          \                  if float(risk.get(\"confidence\",0)) > float(seen.get(\"\
          confidence\",0)):\n                            deduped[i] = risk\n     \
          \                   dup = True\n                        break\n        if\
          \ not dup:\n            deduped.append(risk)\n    # 三阶置信度过滤\n    filtered\
          \ = []\n    fs = {\"discarded\":0,\"downgraded\":0,\"passed\":0}\n    for\
          \ risk in deduped:\n        conf = float(risk.get(\"confidence\", 0.5))\n\
          \        if conf < 0.5:\n            fs[\"discarded\"] += 1\n          \
          \  continue\n        elif conf < 0.7:\n            risk[\"low_confidence\"\
          ] = True\n            risk[\"note\"] = \"低置信度,建议人工复核\"\n            rl =\
          \ risk.get(\"risk_level\", \"low\")\n            risk[\"risk_level\"] =\
          \ \"low\" if rl in (\"medium\",\"low\") else \"medium\"\n            filtered.append(risk)\n\
          \            fs[\"downgraded\"] += 1\n        else:\n            risk[\"\
          low_confidence\"] = False\n            filtered.append(risk)\n         \
          \   fs[\"passed\"] += 1\n    order = {\"high\":0,\"medium\":1,\"low\":2}\n\
          \    filtered.sort(key=lambda r: order.get(r.get(\"risk_level\",\"low\"\
          ),3))\n    st = {\"total\":len(filtered),\"high\":sum(1 for r in filtered\
          \ if r.get(\"risk_level\")==\"high\"),\"medium\":sum(1 for r in filtered\
          \ if r.get(\"risk_level\")==\"medium\"),\"low\":sum(1 for r in filtered\
          \ if r.get(\"risk_level\")==\"low\")}\n    return {\"risks_json\":json.dumps(filtered,ensure_ascii=False),\"\
          count\":len(filtered),\"overall_score\":overall_score,\"stats_json\":json.dumps(st,ensure_ascii=False),\"\
          filter_json\":json.dumps(fs,ensure_ascii=False)}"
