          \ |\n\n{confirm_note}\n### 关键要素\n```json\n{elements_json}\n```\n\n---\n\n\
          ## 二、风险评估总览\n\n### 综合风险评分:{overall_score}/100\n\n{level_note}\n\n### 风险分布\
          \ {stats_json}\n### 置信度过滤 {filter_json}\n### 检出{count}条风险\n\n---\n\n## 三、风险条款逐项分析\n\
          ```json\n{risks_json}\n```\n\n---\n\n## 四、条款完整性检查\n```json\n{compare_text}\n\
          ```\n\n---\n\n## 五、修改建议汇总\n1. ⚠️ 高风险条款:签署前必须解决\n2. \U0001F4CB 中风险条款:建议协商修改方案\n\
          3. \U0001F4A1 低风险条款:后续版本优化\n**谈判顺序**:先违约责任和知识产权→再付款条件和保密→最后协商细节\n\n---\n\
          \n## 六、附录\n### 审核标准\n风险等级:高(>10万元损失/违反强制性法律)|中(争议/商业风险)|低(表述不精确)\n风险类型:R01-R12共12类\
          \ | 检测方法:规则引擎\n\n### 规则引擎原始检出\n```json\n{findings_json}\n```\n\n> ⚠️ **免责声明**:本报告由AI自动生成,仅供参考。AI审核无法替代专业法律判断。所有标注均经置信度过滤,建议法务人员最终复核。\n\
          \n---\n\U0001F4C5 {ts} | Powered by SmartContract Auditor v1.0\"\"\"\n \
          \   return {\"report\": report}\n"
