        desc: 抽取双方信息/金额/日期/争议解决/适用法律
        memory:
          query_prompt_template: ''
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 50
        model:
          completion_params: {}
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: sys-prompt
          role: system
          text: "你是合同信息抽取专家。从合同原文中提取关键要素，只输出JSON，不要解释。\n\n输出格式：\n{\n  \"parties\"\
            : {\n    \"party_a\": {\"name\": \"甲方公司全称\", \"role\": \"买方/卖方/出租方等\"\
            },\n    \"party_b\": {\"name\": \"乙方公司全称\", \"role\": \"买方/卖方/承租方等\"}\n\
            \  },\n  \"amount\": {\"value\": 总金额数字, \"currency\": \"CNY\", \"description\"\
            : \"金额条款简述\"},\n  \"dates\": {\"signing_date\": \"YYYY-MM-DD\", \"effective_date\"\
            : \"YYYY-MM-DD\", \"expiry_date\": \"YYYY-MM-DD\"},\n  \"dispute_resolution\"\
            : {\"method\": \"诉讼/仲裁\", \"court\": \"管辖法院\"},\n  \"governing_law\":\
            \ \"适用法律\",\n  \"summary\": \"100字内合同摘要\"\n}\n\n规则：从合同原文逐项查找。找到的填实际值，找不到的填null（JSON\
            \ null不是字符串\"null\"）。"
        - id: user-prompt
          role: user
          text: '参考合同分类:{{ code_classify_parse.contract_type }}

            依据{{#code_parse.paragraphs_json#}}

            请从上方上下文中的合同原文提取要素'
        selected: false
        title: 关键要素抽取
        type: llm
        variables: []
        vision:
          enabled: false
      height: 131
      id: llm_extract
      position:
        x: 1440
        y: 282
      positionAbsolute:
        x: 1440
        y: 282
      selected: false
      type: custom
      width: 242
    - data:
        code: "import json, re\nfrom typing import Any\n\ndef main(llm_output: str)\
          \ -> dict[str, Any]:\n    elements = {}; issues = []\n    try:\n       \
          \ m = re.search(r'\\{[\\s\\S]*\\}', llm_output)\n        if m: elements\
          \ = json.loads(m.group(0))\n    except Exception:\n        issues.append(\"\
          JSON解析失败\")\n    parties = elements.get(\"parties\", {})\n    if not parties.get(\"\
          party_a\", {}).get(\"name\"): issues.append(\"甲方信息缺失\")\n    if not parties.get(\"\
          party_b\", {}).get(\"name\"): issues.append(\"乙方信息缺失\")\n    dates = elements.get(\"\
          dates\", {})\n    if not any(dates.get(k) for k in [\"signing_date\",\"\
          effective_date\",\"expiry_date\"]):\n        issues.append(\"未识别到日期信息\"\
          )\n    return {\"elements_json\": json.dumps(elements, ensure_ascii=False),\
          \ \"quality\": \"poor\" if len(issues)>1 else (\"partial\" if issues else\
          \ \"good\"), \"issues_json\": json.dumps(issues, ensure_ascii=False)}\n"
        code_language: python3
        desc: 解析并校验抽取结果
        outputs:
          elements_json:
            children: null
            type: string
          issues_json:
            children: null
            type: string
          quality:
            children: null
            type: string
        selected: false
        title: 要素校验
        type: code
        variables:
        - value_selector:
          - llm_extract
          - text
          variable: llm_output
      height: 79
      id: code_extract_validate
      position:
        x: 1780
        y: 282
      positionAbsolute:
        x: 1780
        y: 282
      selected: false
      type: custom
      width: 242
    - data:
        code: "import re, json\nfrom typing import Any\n\nRULES = [\n    {\"id\":\"\
          R01\",\"name\":\"违约金过高\",\"patterns\":[r'违约.*?(\\d+)%',r'(\\d+)%.*?违约'],\"\
          base_level\":\"medium\",\"scorer\":\"score_r01\"},\n    {\"id\":\"R02\"\
          ,\"name\":\"无限责任条款\",\"patterns\":[r'全部损失',r'一切责任',r'无限责任'],\"base_level\"\
          :\"high\",\"scorer\":None},\n    {\"id\":\"R03\",\"name\":\"单方解约权\",\"patterns\"\
          :[r'有权.*?单方.*?解除',r'任意.*?解除.*?合同',r'随时.*?终止'],\"base_level\":\"medium\"\
          ,\"scorer\":None},\n    {\"id\":\"R04\",\"name\":\"管辖条款不利\",\"patterns\"\
          :[r'管辖.*?(对方|乙方)',r'(对方|乙方).*?管辖',r'仲裁.*?(对方|乙方).*?所在地'],\"base_level\"\
          :\"medium\",\"scorer\":None},\n    {\"id\":\"R05\",\"name\":\"保密期间不合理\"\
          ,\"patterns\":[r'永久.*?保密',r'无限期.*?保密',r'保密.*?期限.*?(\\d+)年'],\"base_level\"\
          :\"medium\",\"scorer\":\"score_r05\"},\n    {\"id\":\"R06\",\"name\":\"\
          知识产权归属不清\",\"patterns\":[r'知识产权.*?归属.*?(乙方|默认)',r'知识产权.*?默认.*?归'],\"base_level\"\
          :\"high\",\"scorer\":None},\n    {\"id\":\"R07\",\"name\":\"付款条件不公平\",\"\
          patterns\":[r'预付.*?(\\d+)%',r'(\\d+)%.*?预付',r'验收后.*?付款',r'预付款.*?比例.*?(\\\
          d+)%'],\"base_level\":\"medium\",\"scorer\":\"score_r07\"},\n    {\"id\"\
          :\"R10\",\"name\":\"竞业限制过宽\",\"patterns\":[r'竞业.*?限制.*?(\\d+)年',r'竞业.*?范围.*?全国'],\"\
          base_level\":\"medium\",\"scorer\":\"score_r10\"},\n    {\"id\":\"R11\"\
          ,\"name\":\"自动续约陷阱\",\"patterns\":[r'期满.*?自动.*?续约',r'自动.*?续期'],\"base_level\"\
          :\"medium\",\"scorer\":\"score_r11\"},\n]\nWHITELIST = [\n    (r'违约金.*?不超过.*?(\\\
          d+)%', lambda m: int(m.group(1)) <= 10),\n    (r'不承担.*?间接.*?损失', None),\n\
          \    (r'不可抗力.*?包括', None),\n]\ndef check_wl(text):\n    for p, cond in WHITELIST:\n\
          \        m = re.search(p, text)\n        if m and (cond is None or cond(m)):\
          \ return True\n    return False\ndef score_r01(m, t):\n    try: r=int(m.group(1));\
          \ return \"high\" if r>=20 else (\"medium\" if r>=10 else \"low\")\n   \
          \ except: return \"medium\"\ndef score_r05(m, t): return \"high\" if ('永久'\
          \ in t or '无限期' in t) else (\"high\" if int(m.group(1))>5 else \"medium\"\
          )\ndef score_r07(m, t): return \"high\" if '验收后' in t else (\"high\" if\
          \ int(m.group(1))>50 else \"medium\")\ndef score_r10(m, t): return \"high\"\
          \ if int(m.group(1))>2 else \"medium\"\ndef score_r11(m, t): return \"low\"\
          \ if re.search(r'提前.*?通知', t) else \"medium\"\n\ndef main(clean_text: str,\
          \ paragraphs_json: str) -> dict[str, Any]:\n    paragraphs = json.loads(paragraphs_json)\
          \ if paragraphs_json else []\n    findings = []; stats = {\"total\":0,\"\
          high\":0,\"medium\":0,\"low\":0}\n    for rule in RULES:\n        seen_paras\
          \ = set()\n        for para in paragraphs:\n            pt = para.get(\"\
          text\",\"\")\n            pi = para.get(\"index\",0)\n            for pat\
          \ in rule[\"patterns\"]:\n                for m in re.finditer(pat, pt):\n\
          \                    matched = m.group(0)\n                    if check_wl(matched):\
          \ continue\n                    if pi in seen_paras: continue  # 同一规则同一段落只保留一条\n\
          \                    seen_paras.add(pi)\n                    level = rule[\"\
          base_level\"]\n                    if rule[\"scorer\"]:\n              \
          \          fn = globals().get(rule[\"scorer\"])\n                      \
