          \ -> dict[str, Any]:\n    all_risks = []\n    rule_findings = json.loads(findings_json)\
          \ if findings_json else []\n    for r in rule_findings: r[\"source\"] =\
          \ \"rule_engine\"\n    all_risks.extend(rule_findings)\n    # 根据检出风险数和等级估算分数\n\
          \    high = sum(1 for r in all_risks if r.get(\"risk_level\")==\"high\"\
          )\n    medium = sum(1 for r in all_risks if r.get(\"risk_level\")==\"medium\"\
          )\n    overall_score = 50\n    if high > 0: overall_score = 70 + min(high*10,\
          \ 25)\n    elif medium > 0: overall_score = 40 + min(medium*5, 25)\n   \
          \ else: overall_score = 20\n    # 去重\n    deduped = []\n    for risk in\
          \ all_risks:\n        dup = False\n        for i, seen in enumerate(deduped):\n\
          \            if risk.get(\"risk_id\") == seen.get(\"risk_id\"):\n      \
          \          t1 = risk.get(\"clause_text\",\"\")[:100]\n                t2\
          \ = seen.get(\"clause_text\",\"\")[:100]\n                if t1 and t2:\n\
          \                    sim = len(set(t1)&set(t2))/max(len(set(t1)|set(t2)),1)\n\
          \                    if sim > 0.7:\n                        if float(risk.get(\"\
          confidence\",0)) > float(seen.get(\"confidence\",0)):\n                \
          \            deduped[i] = risk\n                        dup = True\n   \
          \                     break\n        if not dup: deduped.append(risk)\n\
          \    # 三阶置信度过滤\n    filtered = []\n    fs = {\"discarded\":0,\"downgraded\"\
          :0,\"passed\":0}\n    for risk in deduped:\n        conf = float(risk.get(\"\
          confidence\", 0.5))\n        if conf < 0.5:\n            fs[\"discarded\"\
          ] += 1\n            continue\n        elif conf < 0.7:\n            risk[\"\
          low_confidence\"] = True\n            risk[\"note\"] = \"低置信度,建议人工复核\"\n\
          \            rl = risk.get(\"risk_level\", \"low\")\n            risk[\"\
          risk_level\"] = \"low\" if rl in (\"medium\",\"low\") else \"medium\"\n\
          \            filtered.append(risk)\n            fs[\"downgraded\"] += 1\n\
          \        else:\n            risk[\"low_confidence\"] = False\n         \
          \   filtered.append(risk)\n            fs[\"passed\"] += 1\n    order =\
          \ {\"high\":0,\"medium\":1,\"low\":2}\n    filtered.sort(key=lambda r: order.get(r.get(\"\
          risk_level\",\"low\"),3))\n    st = {\"total\":len(filtered),\"high\":sum(1\
