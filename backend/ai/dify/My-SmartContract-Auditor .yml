          risks_json\":json.dumps(filtered,ensure_ascii=False),\"count\":len(filtered),\"\
          overall_score\":overall_score,\"stats_json\":json.dumps(st,ensure_ascii=False),\"\
          filter_json\":json.dumps(fs,ensure_ascii=False)}\n"
