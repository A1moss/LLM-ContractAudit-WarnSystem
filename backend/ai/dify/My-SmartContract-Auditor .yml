        desc: 上传合同文件或粘贴合同文本
        selected: true
        title: 上传合同
        type: start
        variables:
        - label: 合同文本
          max_length: 100000
          required: false
          type: paragraph
          variable: contract_text
      height: 136
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: true
      type: custom
      width: 242
    - data:
        code: "import re, json\nfrom typing import Any\n\ndef main(contract_text:\
          \ str) -> dict[str, Any]:\n    if not contract_text or not contract_text.strip():\n\
          \        return {\"error\": \"合同文本为空, 请上传有效文件\", \"clean_text\": \"\", \"\
          paragraphs_json\": \"[]\", \"word_count\": 0, \"is_large\": False}\n   \
          \ text = re.sub(r'\\r\\n', '\\n', contract_text.strip())\n    text = re.sub(r'\\\
          n{3,}', '\\n\\n', text)\n    text = re.sub(r' {2,}', ' ', text)\n    chapter_pat\
          \ = re.compile(r'(第[一二三四五六七八九十百千万\\d]+章|第[一二三四五六七八九十百千万\\d]+节|第[一二三四五六七八九十百千万\\\
          d]+条|[一二三四五六七八九十]+、|\\(\\d+\\)|（\\d+）)')\n    paragraphs = []\n    for i,\
          \ para in enumerate(text.split('\\n')):\n        para = para.strip()\n \
          \       if not para: continue\n        m = chapter_pat.match(para)\n   \
          \     paragraphs.append({\"index\": i, \"text\": para, \"length\": len(para),\
          \ \"is_heading\": bool(m), \"heading\": m.group(0) if m else None})\n  \
          \  anonymized = text\n    anonymized = re.sub(r'(公司名称|企业名称)[：:]\\s*[^\\\
          n]+', r'\\1：【甲方公司】', anonymized)\n    anonymized = re.sub(r'(\\d[\\d,.]*)\\\
          s*(万元|元|美元)', r'【金额：\\1\\2】', anonymized)\n    anonymized = re.sub(r'(法定代表人|授权代表)[：:]\\\
          s*[^\\n]+', r'\\1：【签名人】', anonymized)\n    return {\"error\": None, \"clean_text\"\
          : anonymized, \"paragraphs_json\": json.dumps(paragraphs, ensure_ascii=False),\
          \ \"word_count\": len(text), \"is_large\": len(text) > 50000}\n"
        code_language: python3
        desc: 清洗文本、提取条款结构、脱敏处理
        outputs:
          clean_text:
            children: null
            type: string
          error:
            children: null
            type: string
          is_large:
            children: null
            type: boolean
          paragraphs_json:
            children: null
            type: string
          word_count:
            children: null
            type: number
        selected: false
        title: 文档预处理
        type: code
        variables:
        - value_selector:
          - start
          - contract_text
          variable: contract_text
