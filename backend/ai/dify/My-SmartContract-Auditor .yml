        prompt_template:
        - id: sys-prompt
          role: system
          text: '你是合同分类专家。判断合同属于以下哪种类型：

            1. 采购合同 — 采购货物/设备/软件

            2. 销售合同 — 销售产品/服务

            3. 保密协议 — NDA/保密/竞业

            4. 服务外包合同 — IT外包/SaaS/技术服务

            5. 劳动合同 — 劳动/聘用/派遣


            只输出JSON，不要其他内容：

            {"contract_type":"类型","confidence":0.0-1.0,"reasoning":"理由100字内"}

            '
        - id: user-prompt
          role: user
          text: 请根据上下文中的合同内容判断其类型
        selected: false
        title: 合同类型分类
        type: llm
        variables: []
        vision:
          enabled: false
      height: 131
      id: llm_classify
      position:
        x: 760
        y: 282
      positionAbsolute:
        x: 760
        y: 282
      selected: false
      type: custom
      width: 242
    - data:
        code: "import json, re\nfrom typing import Any\n\ndef main(llm_output: str)\
          \ -> dict[str, Any]:\n    result = {\"contract_type\": \"其他合同\", \"confidence\"\
          : 0.0, \"reasoning\": \"\", \"need_confirm\": False}\n    try:\n       \
          \ m = re.search(r'\\{[\\s\\S]*\\}', llm_output)\n        if m:\n       \
          \     d = json.loads(m.group(0))\n            result[\"contract_type\"]\
          \ = d.get(\"contract_type\", \"其他合同\")\n            result[\"confidence\"\
          ] = float(d.get(\"confidence\", 0))\n            result[\"reasoning\"] =\
          \ d.get(\"reasoning\", \"\")\n    except Exception:\n        for t in [\"\
          采购合同\",\"销售合同\",\"保密协议\",\"服务外包合同\",\"劳动合同\"]:\n            if t in llm_output:\n\
          \                result[\"contract_type\"] = t; result[\"confidence\"] =\
          \ 0.5; break\n    if result[\"confidence\"] < 0.5:\n        result[\"contract_type\"\
          ] = \"其他合同\"; result[\"need_confirm\"] = True\n    return result\n"
        code_language: python3
        desc: 解析LLM分类JSON,低置信度标记人工确认
