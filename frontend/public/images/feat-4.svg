<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="f4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/><stop offset="1" stop-color="#EDF3FC"/>
    </linearGradient>
    <linearGradient id="f4head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1935C3"/><stop offset="1" stop-color="#1B70F0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#f4bg)"/>

  <!-- 报告主体 -->
  <g transform="translate(135 54)">
    <rect x="0" y="0" width="300" height="252" rx="12" fill="#fff" stroke="#DCE4F2"/>
    <rect x="0" y="0" width="300" height="46" rx="12" fill="url(#f4head)"/>
    <text x="24" y="30" font-size="16" font-weight="700" fill="#fff">合同审核报告</text>
    <rect x="16" y="62" width="40" height="14" rx="7" fill="#E60012"/>
    <text x="36" y="72.5" font-size="10" fill="#fff" text-anchor="middle">高风险</text>
    <text x="64" y="73" font-size="12" fill="#585E7D">3 项风险 · 5 条建议</text>

    <g font-size="12">
      <circle cx="20" cy="100" r="4" fill="#E60012"/>
      <text x="32" y="104" fill="#131313">违约金条款缺失</text>
      <circle cx="20" cy="124" r="4" fill="#F5A623"/>
      <text x="32" y="128" fill="#131313">付款期限不明确</text>
      <circle cx="20" cy="148" r="4" fill="#23B26D"/>
      <text x="32" y="152" fill="#131313">主体资格已核验</text>
    </g>

    <g>
      <line x1="16" y1="226" x2="284" y2="226" stroke="#E3EAF5"/>
      <rect x="40" y="198" width="26" height="28" rx="3" fill="#23B26D"/>
      <rect x="86" y="182" width="26" height="44" rx="3" fill="#F5A623"/>
      <rect x="132" y="164" width="26" height="62" rx="3" fill="#E60012"/>
      <rect x="178" y="206" width="26" height="20" rx="3" fill="#1B70F0"/>
      <rect x="224" y="190" width="26" height="36" rx="3" fill="#1935C3"/>
    </g>
  </g>

  <!-- 右侧：闭环标注 -->
  <g transform="translate(479 74)">
    <g>
      <circle cx="0" cy="0" r="26" fill="#E8F0FE"/>
      <path d="M-10 0 L-2 8 L12 -8" stroke="#1935C3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="46" font-size="13" font-weight="600" fill="#131313" text-anchor="middle">风险清单</text>
    <g transform="translate(0 96)">
      <circle cx="0" cy="0" r="26" fill="#E8F0FE"/>
      <path d="M-10 0 L-2 8 L12 -8" stroke="#1935C3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="142" font-size="13" font-weight="600" fill="#131313" text-anchor="middle">修改建议</text>
    <g transform="translate(0 192)">
      <circle cx="0" cy="0" r="26" fill="#E8F0FE"/>
      <path d="M-10 0 L-2 8 L12 -8" stroke="#1935C3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="238" font-size="13" font-weight="600" fill="#131313" text-anchor="middle">反馈闭环</text>
    <line x1="0" y1="26" x2="0" y2="70" stroke="#C9D6F0" stroke-width="2"/>
    <line x1="0" y1="122" x2="0" y2="166" stroke="#C9D6F0" stroke-width="2"/>
  </g>
</svg>
