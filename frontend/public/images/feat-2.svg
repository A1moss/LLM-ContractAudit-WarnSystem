<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="f2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/><stop offset="1" stop-color="#FDF2F3"/>
    </linearGradient>
    <linearGradient id="f2shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E60012"/><stop offset="1" stop-color="#FF4D5A"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#f2bg)"/>

  <!-- 左侧：文档 + 扫描高亮 -->
  <g transform="translate(90 75)">
    <rect x="0" y="0" width="150" height="200" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <rect x="0" y="0" width="150" height="32" rx="10" fill="#1935C3"/>
    <rect x="12" y="48" width="110" height="8" rx="4" fill="#E6EDF7"/>
    <rect x="12" y="66" width="90" height="8" rx="4" fill="#E6EDF7"/>
    <rect x="8" y="88" width="134" height="20" rx="4" fill="#FFE1E3"/>
    <rect x="12" y="94" width="80" height="8" rx="4" fill="#E60012" opacity="0.75"/>
    <rect x="12" y="120" width="100" height="8" rx="4" fill="#E6EDF7"/>
    <rect x="12" y="138" width="70" height="8" rx="4" fill="#E6EDF7"/>
    <rect x="8" y="156" width="134" height="20" rx="4" fill="#FFF3D6"/>
    <rect x="12" y="162" width="66" height="8" rx="4" fill="#F5A623" opacity="0.8"/>
  </g>

  <!-- 扫描线 -->
  <rect x="90" y="173.5" width="150" height="3" rx="1.5" fill="#1B70F0" opacity="0.8"/>
  <circle cx="240" cy="175" r="5" fill="#1B70F0"/>

  <!-- 右侧：风险规则 + 盾牌 -->
  <g transform="translate(340 50)">
    <rect x="0" y="0" width="210" height="44" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <circle cx="22" cy="22" r="8" fill="#E60012"/>
    <text x="22" y="26" font-size="13" fill="#fff" text-anchor="middle">!</text>
    <text x="40" y="27" font-size="13.5" font-weight="600" fill="#131313">违约金条款缺失</text>
    <text x="200" y="27" font-size="12" fill="#E60012" text-anchor="end">R03 · 高</text>

    <rect x="0" y="54" width="210" height="44" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <circle cx="22" cy="76" r="8" fill="#F5A623"/>
    <text x="22" y="80" font-size="13" fill="#fff" text-anchor="middle">!</text>
    <text x="40" y="81" font-size="13.5" font-weight="600" fill="#131313">付款期限不明确</text>
    <text x="200" y="81" font-size="12" fill="#F5A623" text-anchor="end">R07 · 中</text>

    <rect x="0" y="108" width="210" height="44" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <circle cx="22" cy="130" r="8" fill="#23B26D"/>
    <text x="22" y="134" font-size="13" fill="#fff" text-anchor="middle">✓</text>
    <text x="40" y="135" font-size="13.5" font-weight="600" fill="#131313">主体资格已核验</text>
    <text x="200" y="135" font-size="12" fill="#23B26D" text-anchor="end">通过</text>

    <!-- 盾牌徽标（缩小居中） -->
    <g transform="translate(105 165)">
      <path d="M0 0 L40 20 V56 C40 82 22 94 0 100 C-22 94 -40 82 -40 56 V20 Z" fill="url(#f2shield)"/>
      <path d="M0 7 L32 22 V56 C32 76 17 85 0 90 C-17 85 -32 76 -32 56 V22 Z" fill="#fff"/>
      <path d="M0 34 L13 47 L0 60 L-13 47 Z" fill="#E60012"/>
    </g>
  </g>
</svg>
