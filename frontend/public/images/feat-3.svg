<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="f3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/><stop offset="1" stop-color="#EDF3FC"/>
    </linearGradient>
    <linearGradient id="f3doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1935C3"/><stop offset="1" stop-color="#1B70F0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#f3bg)"/>

  <!-- 左侧：合同文档 -->
  <g transform="translate(100 70)">
    <rect x="0" y="0" width="140" height="190" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <rect x="0" y="0" width="140" height="30" rx="10" fill="url(#f3doc)"/>
    <rect x="12" y="44" width="90" height="7" rx="3.5" fill="#E6EDF7"/>
    <rect x="12" y="60" width="110" height="7" rx="3.5" fill="#E6EDF7"/>
    <rect x="12" y="76" width="70" height="7" rx="3.5" fill="#E6EDF7"/>
    <!-- 被抽取的高亮要素 -->
    <rect x="8" y="94" width="124" height="16" rx="4" fill="#E3EDFF"/>
    <rect x="12" y="99" width="56" height="6" rx="3" fill="#1B70F0" opacity="0.8"/>
    <rect x="12" y="120" width="100" height="7" rx="3.5" fill="#E6EDF7"/>
    <rect x="8" y="138" width="124" height="16" rx="4" fill="#E3EDFF"/>
    <rect x="12" y="143" width="42" height="6" rx="3" fill="#1B70F0" opacity="0.8"/>
    <rect x="12" y="162" width="80" height="7" rx="3.5" fill="#E6EDF7"/>
  </g>

  <!-- 抽取箭头 -->
  <g stroke="#1B70F0" stroke-width="2" fill="none">
    <path d="M262 130 H300"/>
    <path d="M262 150 H300"/>
  </g>
  <path d="M300 124 L312 130 L300 136 Z" fill="#1B70F0"/>
  <path d="M300 144 L312 150 L300 156 Z" fill="#1B70F0"/>

  <!-- 右侧：结构化要素卡片 -->
  <g transform="translate(336 62)">
    <rect x="0" y="0" width="180" height="52" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <text x="16" y="22" font-size="12" fill="#8A93A6">合同主体</text>
    <text x="16" y="42" font-size="14.5" font-weight="600" fill="#131313">甲乙双方公司</text>

    <rect x="0" y="62" width="180" height="52" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <text x="16" y="84" font-size="12" fill="#8A93A6">合同金额</text>
    <text x="16" y="104" font-size="14.5" font-weight="600" fill="#1935C3">¥ 1,280,000</text>

    <rect x="0" y="124" width="180" height="52" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <text x="16" y="146" font-size="12" fill="#8A93A6">履行期限</text>
    <text x="16" y="166" font-size="14.5" font-weight="600" fill="#131313">2026-03-01 至 2027-02-28</text>

    <rect x="0" y="186" width="180" height="52" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <text x="16" y="208" font-size="12" fill="#8A93A6">违约责任</text>
    <text x="16" y="228" font-size="14.5" font-weight="600" fill="#131313">违约金 20%</text>
  </g>
