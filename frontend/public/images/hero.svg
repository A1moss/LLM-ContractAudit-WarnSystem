<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A3A"/><stop offset="1" stop-color="#123063"/>
    </linearGradient>
    <linearGradient id="hlogo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1935C3"/><stop offset="1" stop-color="#1B70F0"/>
    </linearGradient>
    <linearGradient id="hblue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B70F0"/><stop offset="1" stop-color="#3D87F5"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.85" cy="0" r="0.7">
      <stop offset="0" stop-color="#1B70F0" stop-opacity="0.35"/><stop offset="1" stop-color="#1B70F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#hbg)"/>
  <rect width="640" height="360" fill="url(#hglow)"/>

  <!-- 侧边栏 -->
  <rect x="0" y="0" width="64" height="360" fill="#081426"/>
  <rect x="16" y="16" width="32" height="32" rx="9" fill="url(#hlogo)"/>
  <text x="32" y="37.5" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">A</text>
  <g fill="#33507D">
    <rect x="20" y="70" width="24" height="6" rx="3"/>
    <rect x="20" y="92" width="24" height="6" rx="3" fill="#1B70F0"/>
    <rect x="20" y="114" width="24" height="6" rx="3"/>
    <rect x="20" y="136" width="24" height="6" rx="3"/>
    <rect x="20" y="158" width="24" height="6" rx="3"/>
  </g>
  <rect x="0" y="330" width="64" height="30" fill="#0A1A3A"/>

  <!-- 顶栏 -->
  <rect x="64" y="0" width="576" height="48" fill="#0D2447"/>
  <text x="84" y="30" font-size="14" font-weight="600" fill="#E7EEFB">合同审核工作台</text>
  <rect x="400" y="14" width="160" height="22" rx="11" fill="#122B58"/>
  <circle cx="416" cy="25" r="4" fill="#33507D"/>
  <rect x="426" y="22" width="90" height="6" rx="3" fill="#33507D"/>
  <circle cx="592" cy="25" r="12" fill="#1B70F0"/>
  <circle cx="592" cy="25" r="5" fill="#fff" opacity="0.7"/>

  <!-- 4 个统计卡片 -->
  <g>
    <rect x="84" y="66" width="126" height="70" rx="10" fill="#0E2650"/>
    <text x="98" y="92" font-size="12" fill="#8FA6CC">今日审核</text>
    <text x="98" y="122" font-size="26" font-weight="700" fill="#fff">128</text>
    <text x="132" y="122" font-size="13" fill="#5B7FB8">份</text>

    <rect x="222" y="66" width="126" height="70" rx="10" fill="#0E2650"/>
    <text x="236" y="92" font-size="12" fill="#8FA6CC">待处理</text>
    <text x="236" y="122" font-size="26" font-weight="700" fill="#F5A623">16</text>
    <text x="266" y="122" font-size="13" fill="#5B7FB8">份</text>

    <rect x="360" y="66" width="126" height="70" rx="10" fill="#0E2650"/>
    <text x="374" y="92" font-size="12" fill="#8FA6CC">本月风险</text>
    <text x="374" y="122" font-size="26" font-weight="700" fill="#E60012">23</text>
    <text x="400" y="122" font-size="13" fill="#5B7FB8">条</text>

    <rect x="498" y="66" width="122" height="70" rx="10" fill="#0E2650"/>
    <text x="512" y="92" font-size="12" fill="#8FA6CC">通过率</text>
    <text x="512" y="122" font-size="26" font-weight="700" fill="#23B26D">96.4</text>
    <text x="568" y="122" font-size="13" fill="#5B7FB8">%</text>
  </g>

  <!-- 左：风险分布柱状图 -->
  <rect x="84" y="150" width="300" height="186" rx="10" fill="#0E2650"/>
  <text x="98" y="174" font-size="13" font-weight="600" fill="#E7EEFB">风险分布</text>
  <g stroke="#1D3560" stroke-width="1">
    <line x1="98" y1="306" x2="370" y2="306"/>
    <line x1="98" y1="306" x2="98" y2="196"/>
  </g>
  <!-- 三根柱 -->
  <rect x="140" y="270" width="34" height="36" rx="4" fill="#23B26D"/>
  <rect x="212" y="238" width="34" height="68" rx="4" fill="#F5A623"/>
  <rect x="284" y="204" width="34" height="102" rx="4" fill="#E60012"/>
  <text x="157" y="322" font-size="11" fill="#8FA6CC">低</text>
  <text x="229" y="322" font-size="11" fill="#8FA6CC">中</text>
  <text x="301" y="322" font-size="11" fill="#8FA6CC">高</text>

  <!-- 右：合同列表 -->
  <rect x="396" y="150" width="224" height="186" rx="10" fill="#0E2650"/>
  <text x="410" y="174" font-size="13" font-weight="600" fill="#E7EEFB">最近合同</text>
  <g font-size="11">
    <rect x="410" y="188" width="196" height="34" rx="6" fill="#122B58"/>
    <text x="420" y="209" fill="#CDD9EE">采购服务合同.pdf</text>
    <rect x="560" y="195" width="36" height="18" rx="9" fill="#1B70F0" opacity="0.25"/>
    <text x="568" y="208" fill="#8FB4FF">已审核</text>

    <rect x="410" y="228" width="196" height="34" rx="6" fill="#122B58"/>
    <text x="420" y="249" fill="#CDD9EE">技术开发合同.pdf</text>
    <rect x="560" y="235" width="36" height="18" rx="9" fill="#E60012" opacity="0.25"/>
    <text x="568" y="248" fill="#FF8A93">高风险</text>

    <rect x="410" y="268" width="196" height="34" rx="6" fill="#122B58"/>
    <text x="420" y="289" fill="#CDD9EE">房屋租赁合同.pdf</text>
    <rect x="560" y="275" width="36" height="18" rx="9" fill="#23B26D" opacity="0.25"/>
    <text x="568" y="288" fill="#7BD9AE">低风险</text>
  </g>
</svg>