<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="f1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/><stop offset="1" stop-color="#EEF3FC"/>
    </linearGradient>
    <linearGradient id="f1doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1935C3"/><stop offset="1" stop-color="#1B70F0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#f1bg)"/>
  <g stroke="#E3EAF5" stroke-width="1">
    <line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- 左侧：合同文档 -->
  <g transform="translate(60 90)">
    <rect x="0" y="0" width="130" height="180" rx="10" fill="#fff" stroke="#DCE4F2"/>
    <rect x="0" y="0" width="130" height="30" rx="10" fill="url(#f1doc)"/>
    <rect x="10" y="40" width="70" height="6" rx="3" fill="#C7D4EC"/>
    <rect x="10" y="54" width="100" height="6" rx="3" fill="#E6EDF7"/>
    <rect x="10" y="68" width="90" height="6" rx="3" fill="#E6EDF7"/>
    <rect x="10" y="82" width="104" height="6" rx="3" fill="#E6EDF7"/>
    <rect x="10" y="96" width="60" height="6" rx="3" fill="#E6EDF7"/>
    <rect x="10" y="116" width="96" height="6" rx="3" fill="#E6EDF7"/>
    <rect x="10" y="130" width="84" height="6" rx="3" fill="#E6EDF7"/>
    <rect x="10" y="144" width="100" height="6" rx="3" fill="#E6EDF7"/>
  </g>

  <!-- 中间：抽取箭头 -->
  <g stroke="#1B70F0" stroke-width="2" fill="none">
    <path d="M195 180 H260"/>
  </g>
  <path d="M260 174 L272 180 L260 186 Z" fill="#1B70F0"/>

  <!-- 右侧：分类标签 -->
  <g transform="translate(270 90)">
    <rect x="0" y="0" width="190" height="36" rx="18" fill="#1935C3"/>
    <text x="95" y="23" font-size="14" fill="#fff" text-anchor="middle">买卖合同</text>
    <rect x="0" y="48" width="150" height="36" rx="18" fill="#fff" stroke="#C9D6F0"/>
    <text x="75" y="71" font-size="14" fill="#1935C3" text-anchor="middle">服务外包</text>
    <rect x="160" y="48" width="150" height="36" rx="18" fill="#fff" stroke="#C9D6F0"/>
    <text x="235" y="71" font-size="14" fill="#585E7D" text-anchor="middle">民法典 · 合同编</text>
    <rect x="0" y="96" width="130" height="36" rx="18" fill="#fff" stroke="#C9D6F0"/>
    <text x="65" y="119" font-size="14" fill="#585E7D" text-anchor="middle">技术合同</text>
    <rect x="140" y="96" width="140" height="36" rx="18" fill="#fff" stroke="#C9D6F0"/>
    <text x="210" y="119" font-size="14" fill="#585E7D" text-anchor="middle">租赁合同</text>
    <rect x="0" y="144" width="140" height="36" rx="18" fill="#fff" stroke="#C9D6F0"/>
    <text x="70" y="167" font-size="14" fill="#585E7D" text-anchor="middle">承揽合同</text>
    <rect x="150" y="144" width="140" height="36" rx="18" fill="#fff" stroke="#C9D6F0"/>
    <text x="220" y="167" font-size="14" fill="#585E7D" text-anchor="middle">+ 8 类</text>
  </g>
</svg>
